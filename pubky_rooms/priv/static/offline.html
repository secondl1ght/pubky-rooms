      <h1>You are offline</h1>
      <p>
        Rooms are live: messages come straight from their authors' homeservers, so there is nothing to
        show without a connection. Your own messages are safe on your homeserver.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Retry without flashing: probe the app (a HEAD the worker never
      // intercepts) and reload only when it answers with a good status (a 5xx
      // while a deploy replaces the machine is not the app being back). A few attempts after
      // loading (a freshly launched installed app can fail its first request
      // while the OS is still connecting), then again whenever the browser
      // reports the connection back. A real outage leaves the page as it is.
      (function () {
        var delays = [2000, 5000, 10000], attempt = 0, timer = null
        function probe() {
          timer = null
          fetch(location.href, {method: "HEAD", cache: "no-store", credentials: "same-origin"})
            .then(function (r) { if (r.ok) location.reload(); else schedule() })
            .catch(schedule)
        }
        function schedule() {
          if (timer || attempt >= delays.length) return
          timer = setTimeout(probe, delays[attempt++])
        }
        addEventListener("online", function () { attempt = 0; if (!timer) probe() })
        if (navigator.onLine) schedule()
      })()
    </script>
