      <h1>You are offline</h1>
      <p>
        Rooms are live: messages come straight from their authors' homeservers, so there is nothing to
        show without a connection. Your own messages are safe on your homeserver.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", function () { location.reload() })
      try {
        if (navigator.onLine && !sessionStorage.getItem("offline-retried")) {
          sessionStorage.setItem("offline-retried", "1")
          setTimeout(function () { location.reload() }, 2000)
        }
      } catch (_e) {}
    </script>
