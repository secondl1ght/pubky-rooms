# Regenerates the visual-regression baselines (pubky_rooms/test/vrt/snapshots)
# with CI's Chromium and commits them to the branch the workflow is run from:
#
#   gh workflow run "VRT baselines" --ref main     # then: git pull
#
# The commit is made with GITHUB_TOKEN, so it triggers no CI run by itself;
# the workflow then starts CI on the branch head, whose `vrt` job compares
# against the new baselines (and, on main, a green run deploys). Run it after an intended visual change, never to
# make an unexplained diff go away.
name: VRT baselines

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vrt-baselines-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.3"

jobs:
  regenerate:
    name: regenerate on ${{ github.ref_name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubky_rooms
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pubky_rooms/assets/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            pubky_rooms/deps
            pubky_rooms/_build
          key: ${{ runner.os }}-pubky_rooms-test-${{ hashFiles('pubky_rooms/mix.lock') }}
          restore-keys: ${{ runner.os }}-pubky_rooms-test-
      - run: npm ci
        working-directory: pubky_rooms/assets
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pubky_rooms/assets/package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: pubky_rooms/assets
      - run: npx playwright install-deps chromium
        working-directory: pubky_rooms/assets
      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build
      - run: rm -f test/vrt/snapshots/*.png
      - run: mix test --only vrt
      - name: Commit the baselines to ${{ github.ref_name }}
        run: |
          git add test/vrt/snapshots
          if git diff --cached --quiet; then echo "baselines unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "VRT baselines regenerated by CI's Chromium (run ${{ github.run_id }})"
          # the branch may have moved while the screenshots were taken (a docs
          # push, say): rebase the one PNG commit onto it before pushing
          git fetch --quiet origin "${{ github.ref_name }}"
          git rebase --quiet "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          # the commit above triggers nothing by itself; CI on the new head
          # verifies the baselines and, on main, deploys
          gh workflow run CI --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
