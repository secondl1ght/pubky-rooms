name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.3"

jobs:
  test:
    name: ${{ matrix.project }} · test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pubky_ex, pubky_rooms]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-${{ matrix.project }}-test-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.project }}-test-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test

  hooks:
    name: pubky_rooms · hooks (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubky_rooms/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pubky_rooms/assets/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: pubky_rooms · browser smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubky_rooms
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pubky_rooms/assets/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            pubky_rooms/deps
            pubky_rooms/_build
          key: ${{ runner.os }}-pubky_rooms-test-${{ hashFiles('pubky_rooms/mix.lock') }}
          restore-keys: ${{ runner.os }}-pubky_rooms-test-
      - run: npm ci
        working-directory: pubky_rooms/assets
      - run: npx playwright install --with-deps chromium
        working-directory: pubky_rooms/assets
      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build
      # test/e2e: the checklist's smoke items in headless Chromium against the fakes
      - run: mix test --only e2e

  dialyzer:
    name: ${{ matrix.project }} · dialyzer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pubky_ex, pubky_rooms]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-${{ matrix.project }}-dialyzer-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.project }}-dialyzer-
      - run: mix deps.get
      - run: mix dialyzer --format github
