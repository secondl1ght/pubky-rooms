name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

# a newer push to the same branch supersedes the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.3"

jobs:
  test:
    name: ${{ matrix.project }} · test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pubky_ex, pubky_rooms]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-${{ matrix.project }}-test-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.project }}-test-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test

  hooks:
    name: pubky_rooms · hooks (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubky_rooms/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pubky_rooms/assets/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: pubky_rooms · browser smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubky_rooms
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pubky_rooms/assets/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            pubky_rooms/deps
            pubky_rooms/_build
          key: ${{ runner.os }}-pubky_rooms-test-${{ hashFiles('pubky_rooms/mix.lock') }}
          restore-keys: ${{ runner.os }}-pubky_rooms-test-
      - run: npm ci
        working-directory: pubky_rooms/assets
      # the Chromium build is cached per Playwright version; its apt libraries
      # are not part of the cache, so install-deps always runs
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pubky_rooms/assets/package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: pubky_rooms/assets
      - run: npx playwright install-deps chromium
        working-directory: pubky_rooms/assets
      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build
      # test/e2e: the checklist's smoke items in headless Chromium against the fakes
      - run: mix test --only e2e

  vrt:
    name: pubky_rooms · visual regression (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubky_rooms
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pubky_rooms/assets/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            pubky_rooms/deps
            pubky_rooms/_build
          key: ${{ runner.os }}-pubky_rooms-test-${{ hashFiles('pubky_rooms/mix.lock') }}
          restore-keys: ${{ runner.os }}-pubky_rooms-test-
      - run: npm ci
        working-directory: pubky_rooms/assets
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pubky_rooms/assets/package-lock.json') }}
      - run: npx playwright install chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: pubky_rooms/assets
      - run: npx playwright install-deps chromium
        working-directory: pubky_rooms/assets
      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build
      # test/vrt: the key screens against the baselines in test/vrt/snapshots
      # (generated by the "VRT baselines" workflow on this same runner image)
      - run: mix test --only vrt
      - name: Every screen has a committed baseline
        run: |
          if [ -n "$(git status --porcelain test/vrt/snapshots)" ]; then
            echo "::error::baselines missing (this run wrote them): run the 'VRT baselines' workflow and pull its commit"
            git status --porcelain test/vrt/snapshots
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-diffs
          path: pubky_rooms/test/vrt/snapshots/__diff__/
          if-no-files-found: ignore

  testnet:
    # both projects' :testnet suites against the real homeserver and relays of
    # the public pubky-docker stack (docker hub image, pinned): writes,
    # listings, sessions, event streams, restarts — no shared service involved
    name: testnet integration (pubky-docker)
    runs-on: ubuntu-latest
    env:
      PUBKY_DOCKER_REF: 75b1121f3e90b9b44d9416ca4f5ba87a4984e800
      HOMESERVER_TAG: v0.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            pubky_ex/deps
            pubky_ex/_build
          key: ${{ runner.os }}-pubky_ex-test-${{ hashFiles('pubky_ex/mix.lock') }}
          restore-keys: ${{ runner.os }}-pubky_ex-test-
      - uses: actions/cache@v4
        with:
          path: |
            pubky_rooms/deps
            pubky_rooms/_build
          key: ${{ runner.os }}-pubky_rooms-test-${{ hashFiles('pubky_rooms/mix.lock') }}
          restore-keys: ${{ runner.os }}-pubky_rooms-test-
      - name: Start the Pubky testnet (homeserver with its PKARR and HTTP relays, postgres)
        run: |
          git clone --quiet https://github.com/pubky/pubky-docker.git "$RUNNER_TEMP/pubky-docker"
          cd "$RUNNER_TEMP/pubky-docker"
          git -c advice.detachedHead=false checkout --quiet "$PUBKY_DOCKER_REF"
          cp .env-sample .env
          docker compose pull --quiet postgres homeserver
          docker compose up --detach --no-build homeserver
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:6286/ && curl -fsS -o /dev/null http://localhost:15411/; then
              echo "homeserver and relay up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the testnet did not come up"; docker compose logs homeserver; exit 1
      - run: mix deps.get && mix test --only testnet
        working-directory: pubky_ex
      - run: mix deps.get && mix test --only testnet test/integration
        working-directory: pubky_rooms
      - name: Homeserver logs
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/pubky-docker" logs --tail 200 homeserver

  dialyzer:
    name: ${{ matrix.project }} · dialyzer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pubky_ex, pubky_rooms]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-${{ matrix.project }}-dialyzer-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.project }}-dialyzer-
      - run: mix deps.get
      - run: mix dialyzer --format github
